<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padaria Bessamar</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* CORES: vinho da marca e dourado trigo. Troque aqui para outro cliente */
  --brand:#7A0A14; --brand-dark:#4F060D; --gold:#D8A94F; --on-brand:#FFFFFF;
  --bg:#FBF8F5; --surface:#FFFFFF; --text:#2A1416; --muted:#6B5558; --line:#EBDFDC; --price:#7A0A14; --soft:#F5ECE8;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#150A0C;--surface:#201112;--text:#F6ECEA;--muted:#BBA5A3;--line:#3A2224;--price:#EFB0B5;--soft:#1B0E10}
}
:root[data-theme="dark"]{--bg:#150A0C;--surface:#201112;--text:#F6ECEA;--muted:#BBA5A3;--line:#3A2224;--price:#EFB0B5;--soft:#1B0E10}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.1;margin:0}
.eyebrow{font:700 .78rem var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--price);margin-bottom:12px;display:block}
h2{font-size:clamp(2rem,5vw,2.9rem);margin-bottom:14px}
.lead{color:var(--muted);max-width:56ch;margin:0 0 34px}
h3{font-size:1.25rem;margin-bottom:8px}
.btn{display:inline-block;background:var(--gold);color:#3A1A04;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:999px;border:2px solid var(--gold);font-size:1rem;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.btn.small{padding:9px 20px;font-size:.92rem}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.strip{background:var(--brand-dark);color:#EBCFD1;font-size:.84rem;text-align:center;padding:7px 12px}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:12px;padding-bottom:12px}
.logo{text-decoration:none;line-height:1.1;text-align:center}
.logo b{display:block;font-family:var(--serif);font-size:1.45rem;letter-spacing:.14em}
.logo small{display:block;font:600 .6rem var(--sans);letter-spacing:.34em;color:var(--gold)}
nav{display:none;gap:26px;font-weight:600;font-size:.95rem}
nav a{text-decoration:none;opacity:.9}
nav a:hover{opacity:1;color:var(--gold)}

.hero{background:radial-gradient(1200px 500px at 85% 20%,#9A1220 0,transparent 60%),linear-gradient(160deg,var(--brand) 0,var(--brand-dark) 100%);color:#fff;overflow:hidden}
.hero .wrap{display:grid;gap:44px;padding-top:56px;padding-bottom:70px;align-items:center}
.hero .eyebrow{color:var(--gold)}
.hero h1{font-size:clamp(2.9rem,8.5vw,5.2rem);letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero p{max-width:46ch;font-size:1.15rem;color:#F1D9DB;margin:22px 0 30px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:flex;gap:22px;flex-wrap:wrap;margin-top:34px;font-size:.92rem;color:#EBCFD1}
.trust b{color:#fff}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;background:rgba(255,255,255,.12);padding:6px 14px;border-radius:999px;margin-bottom:22px}
.dot{width:9px;height:9px;border-radius:50%;background:#9A9A9A}
.dot.on{background:#5BD67A;box-shadow:0 0 0 4px rgba(91,214,122,.25)}
.arch{position:relative;justify-self:center;width:min(300px,78%)}
.arch img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:999px 999px 18px 18px;border:6px solid rgba(255,255,255,.14);box-shadow:0 24px 50px rgba(0,0,0,.35)}
.seal{position:absolute;right:-22px;bottom:34px;width:112px;height:112px;border-radius:50%;background:var(--gold);color:#3A1A04;display:grid;place-content:center;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.3);border:3px dashed rgba(58,26,4,.35);outline:6px solid var(--gold);outline-offset:-1px}
.seal b{font-family:var(--serif);font-size:2.2rem;line-height:1}
.seal span{font:700 .62rem var(--sans);letter-spacing:.16em}

section{padding:76px 0}
.cards{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(80,20,25,.1)}
.card p{margin:0;color:var(--muted)}
.ic{width:52px;height:52px;border-radius:14px;background:var(--brand);display:grid;place-items:center;margin-bottom:16px}
.ic svg{width:28px;height:28px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{font:700 .95rem var(--sans);background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:9px 20px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 26px}
.panel li{list-style:none;display:flex;align-items:baseline;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.panel li:last-child{border-bottom:0}
.panel ul{margin:0;padding:0}
.panel .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:10px}
.panel .p{font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--price);white-space:nowrap}
.note{color:var(--muted);font-size:.9rem;margin:18px 0 0}

.alt{background:var(--soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.about{display:grid;gap:36px;align-items:center}
.about p{color:var(--muted);max-width:58ch;margin:0 0 14px}
.photo{position:relative;max-width:420px}
.photo img{width:100%;border-radius:18px;box-shadow:0 18px 40px rgba(80,20,25,.2)}
.photo figcaption{font-size:.85rem;color:var(--muted);margin-top:10px}
.stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:26px}
.stats b{display:block;font-family:var(--serif);font-size:2.4rem;line-height:1.1;color:var(--price)}
.stats span{color:var(--muted);font-size:.9rem}

.stars{color:var(--gold);letter-spacing:3px;margin-bottom:10px;font-size:1.05rem}
.quote p{margin:0 0 10px;font-family:var(--serif);font-size:1.12rem;line-height:1.45}
.quote small{color:var(--muted)}

.steps{display:grid;gap:20px;margin-top:6px}
.step{display:flex;gap:16px}
.step i{flex:none;width:44px;height:44px;border-radius:50%;background:var(--gold);color:#3A1A04;display:grid;place-items:center;font:700 1.2rem var(--serif);font-style:normal}
.step p{margin:0;color:#F1D9DB}
.delivery{background:linear-gradient(160deg,var(--brand),var(--brand-dark));color:#fff}
.delivery .eyebrow{color:var(--gold)}
.delivery .lead{color:#F1D9DB}

.info{display:grid;gap:40px}
.hblock{margin-bottom:22px}
.hours{width:100%;border-collapse:collapse}
.hours td{padding:10px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right;font-weight:700}
.addr p{margin:0 0 12px}
.addr a{color:var(--price);font-weight:700}

footer{background:var(--brand-dark);color:#E6C9CB;padding:30px 0;font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:#25A855;color:#fff;text-decoration:none;font-weight:700;padding:13px 20px;border-radius:999px;box-shadow:0 8px 22px rgba(0,0,0,.3);font-size:.95rem}

.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}.card,.btn{transition:none}}

@media (min-width:820px){
  nav{display:flex}
  .hero .wrap{grid-template-columns:1.15fr .85fr}
  .cards.three{grid-template-columns:repeat(3,1fr)}
  .about{grid-template-columns:1.2fr .8fr}
  .quotes{grid-template-columns:repeat(3,1fr)}
  .delivery .wrap{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
  .info{grid-template-columns:1.1fr .9fr}
  .fab{display:none}
}

</style>
</head>
<body>
<div class="strip" id="strip"></div>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#"><b data-t="name"></b><small data-t="tag"></small></a>
    <nav><a href="#cardapio">Cardápio</a><a href="#delivery">Delivery</a><a href="#historia">Nossa história</a><a href="#contato">Contato</a></nav>
    <a class="btn small" data-wa href="#" data-t="ctaShort"></a>
  </div>
</header>

<main>
  <div class="hero">
    <div class="wrap">
      <div>
        <span class="badge"><span class="dot" id="dot"></span><span id="openNow">Verificando horário...</span></span>
        <span class="eyebrow" data-t="eyebrow"></span>
        <h1 id="h1"></h1>
        <p data-t="subheadline"></p>
        <div class="row">
          <a class="btn" data-wa href="#" data-t="cta"></a>
          <a class="btn ghost" href="#cardapio" data-t="secondaryCta"></a>
        </div>
        <div class="trust" id="trust"></div>
      </div>
      <div class="arch">
        <img data-img="fachada" alt="Fachada da Padaria Bessamar no Jardim Oceania">
        <div class="seal"><b>40</b><span>ANOS</span></div>
      </div>
    </div>
  </div>

  <section>
    <div class="wrap">
      <span class="eyebrow rv">Por que a Bessamar</span>
      <h2 class="rv" data-t="whyTitle"></h2>
      <div class="cards three" id="facts" style="margin-top:30px"></div>
    </div>
  </section>

  <section id="cardapio" class="alt">
    <div class="wrap rv">
      <span class="eyebrow">Cardápio</span>
      <h2>Do café da manhã ao lanche</h2>
      <p class="lead" data-t="menuLead"></p>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="panel" id="panel" role="tabpanel"></div>
      <p class="note" data-t="menuNote"></p>
    </div>
  </section>

  <section id="delivery" class="delivery">
    <div class="wrap">
      <div class="rv">
        <span class="eyebrow">Delivery Bessamar</span>
        <h2 data-t="deliveryTitle"></h2>
        <p class="lead" data-t="deliveryLead"></p>
        <a class="btn" data-wa href="#" data-t="cta"></a>
      </div>
      <div class="steps rv" id="steps"></div>
    </div>
  </section>

  <section id="historia">
    <div class="wrap about">
      <div class="rv">
        <span class="eyebrow">Nossa história</span>
        <h2 data-t="aboutTitle"></h2>
        <div id="aboutText"></div>
        <div class="stats" id="stats"></div>
      </div>
      <figure class="photo rv" style="margin:0">
        <img data-img="interior" alt="Interior da padaria, com vitrines de salgados e doces">
        <figcaption>Vitrines e balcão da Padaria Bessamar</figcaption>
      </figure>
    </div>
  </section>

  <section class="alt" style="padding:70px 0">
    <div class="wrap">
      <span class="eyebrow rv">Avaliações</span>
      <h2 class="rv">Quem prova, recomenda</h2>
      <div class="cards quotes" id="quotes" style="margin-top:28px"></div>
    </div>
  </section>

  <section id="contato">
    <div class="wrap info">
      <div id="hoursWrap" class="rv"></div>
      <div class="addr rv">
        <span class="eyebrow">Contato</span>
        <h2>Onde estamos</h2>
        <p data-t="address"></p>
        <p><a data-map href="#" target="_blank" rel="noopener">Abrir no mapa</a></p>
        <p>Telefone: <a data-tel href="#" data-t="phoneLabel"></a></p>
        <p>Delivery: <a data-wa href="#" data-t="deliveryLabel"></a></p>
        <p><a data-ig href="#" target="_blank" rel="noopener" data-t="instagramLabel"></a></p>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span data-t="footer"></span>
    <span data-t="address"></span>
  </div>
</footer>

(function(){
  const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const C = CONFIG, h = n => String(n).replace(/\.5$/, "h30").replace(/^(\d+)$/, "$1h");
  const ICONS = [
    '<path d="M12 21V8M12 8c0-3 2-4 4-4 0 3-1 4-4 4zM12 12c0-3-2-4-4-4 0 3 1 4 4 4zM12 16c0-3 2-4 4-4 0 3-1 4-4 4zM12 16c0-3-2-4-4-4 0 3 1 4 4 4z"/>',
    '<path d="M3 20h18M5 20v-6a7 7 0 0 1 14 0v6M12 4v3M9 14h.01M15 14h.01M12 17h.01"/>',
    '<path d="M3 11h18M5 11a7 7 0 0 1 14 0M4 15h16M6 19h12a2 2 0 0 0 2-2v-2H4v2a2 2 0 0 0 2 2z"/>'];
  document.title = "Padaria Bessamar | Pães, lanches e delivery em João Pessoa";
  $$('[data-t]').forEach(el => { if (C[el.dataset.t] != null) el.textContent = C[el.dataset.t]; });
  $('#h1').innerHTML = esc(C.headline).replace(/\*(.+?)\*/, "<em>$1</em>");
  const wa = "https://wa.me/" + C.whatsapp + "?text=" + encodeURIComponent(C.whatsappMsg);
  $$('[data-wa]').forEach(a => { a.href = wa; a.target = "_blank"; a.rel = "noopener"; });
  $$('[data-tel]').forEach(a => a.href = "tel:" + C.phone);
  $$('[data-ig]').forEach(a => a.href = "https://instagram.com/" + C.instagram);
  $$('[data-map]').forEach(a => a.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(C.address));
  $$('[data-img]').forEach(i => i.src = IMAGES[i.dataset.img]);
  $('#strip').textContent = "Delivery de segunda a sábado, das 8h às 16h · WhatsApp " + C.deliveryLabel.replace(" (WhatsApp)","");
  $('#trust').innerHTML = C.stats.map(s => `<span><b>${esc(s.n)}</b> ${esc(s.l)}</span>`).join('');

  $('#facts').innerHTML = C.facts.map((f,i) => `<div class="card rv"><div class="ic"><svg viewBox="0 0 24 24">${ICONS[i%3]}</svg></div><h3>${esc(f.t)}</h3><p>${esc(f.d)}</p></div>`).join('');
  $('#steps').innerHTML = C.steps.map((s,i) => `<div class="step"><i>${i+1}</i><div><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p></div></div>`).join('');
  $('#tabs').innerHTML = C.menu.map((c,i) => `<button class="tab" role="tab" data-i="${i}" aria-selected="${i==0}">${esc(c.title)}</button>`).join('');
  const show = i => {
    $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.i == i));
    $('#panel').innerHTML = '<ul>' + C.menu[i].items.map(x => `<li><span>${esc(x[0])}</span><span class="dots"></span><span class="p">${esc(x[1])}</span></li>`).join('') + '</ul>';
  };
  $$('.tab').forEach(t => t.addEventListener('click', () => show(t.dataset.i)));
  show(0);

  $('#aboutText').innerHTML = C.about.map(p => `<p>${esc(p)}</p>`).join('');
  $('#stats').innerHTML = C.stats.map(s => `<div><b>${esc(s.n)}</b><span>${esc(s.l)}</span></div>`).join('');
  $('#quotes').innerHTML = C.quotes.map(q => `<div class="card quote rv"><div class="stars">★★★★★</div><p>“${esc(q.text)}”</p><small>${esc(q.who)}</small></div>`).join('');
  $('#hoursWrap').innerHTML = '<span class="eyebrow">Funcionamento</span><h2>Horários</h2>' + C.hours.map(b =>
    `<div class="hblock"><h3>${esc(b.label)}</h3><table class="hours">${b.rows.map(r =>
    `<tr><td>${esc(r.text)}</td><td>${h(r.from)} às ${h(r.to)}</td></tr>`).join('')}</table></div>`).join('');

  try {
    const p = new Intl.DateTimeFormat("en-US",{timeZone:"America/Fortaleza",weekday:"short",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(new Date());
    const g = t => p.find(x => x.type === t).value;
    const day = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday"));
    const now = (+g("hour") % 24) + (+g("minute")) / 60;
    const r = C.hours[0].rows.find(r => r.days.includes(day));
    const open = r && now >= r.from && now < r.to;
    $('#dot').classList.toggle('on', !!open);
    $('#openNow').textContent = open ? "Aberto agora · fecha às " + h(r.to) : "Fechado agora · confira os horários";
  } catch (e) { $('#openNow').textContent = "Confira nossos horários"; }

  const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.12}) : null;
  $$('.rv').forEach(el => io ? io.observe(el) : el.classList.add('in'));
})();
